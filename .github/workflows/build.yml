name: Build and Release

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Publish Self-Contained App (win-x64)
      shell: pwsh
      run: |
        dotnet publish src/TerminalAppRemover/TerminalAppRemover.csproj -c Release -r win-x64 --self-contained true -o ./publish/TerminalAppRemover-win-x64

    - name: Create ZIP Package
      shell: pwsh
      run: |
        Compress-Archive -Path ./publish/TerminalAppRemover-win-x64/* -DestinationPath ./TerminalAppRemover-win-x64.zip

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TerminalAppRemover-win-x64
        path: ./TerminalAppRemover-win-x64.zip
        if-no-files-found: error

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          ./publish/TerminalAppRemover-win-x64/TerminalAppRemover.exe
          ./TerminalAppRemover-win-x64.zip
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
