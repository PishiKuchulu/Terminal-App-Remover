name: Build and Release

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

# Least privilege by default: builds and tests only READ the repo.
# Write access exists solely on the release job below.
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Run parser/matching unit tests
      shell: pwsh
      run: dotnet run --project tests/TerminalAppRemover.Tests -c Release

    - name: Verify release tag matches project version
      if: startsWith(github.ref, 'refs/tags/')
      shell: pwsh
      run: |
        [xml]$csproj = Get-Content src/TerminalAppRemover/TerminalAppRemover.csproj
        $version = $csproj.Project.PropertyGroup.Version | Select-Object -First 1
        $tag = "${{ github.ref_name }}".TrimStart('v')
        if ($version -ne $tag) {
          Write-Error "Tag v$tag does not match csproj <Version> $version. Bump the version or fix the tag."
          exit 1
        }
        Write-Host "Version check OK: $version"

    - name: Publish Self-Contained App (win-x64)
      shell: pwsh
      run: |
        dotnet publish src/TerminalAppRemover/TerminalAppRemover.csproj -c Release -r win-x64 --self-contained true -o ./publish/TerminalAppRemover-win-x64

    - name: Create ZIP Package
      shell: pwsh
      run: |
        Compress-Archive -Path ./publish/TerminalAppRemover-win-x64/* -DestinationPath ./TerminalAppRemover-win-x64.zip

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TerminalAppRemover-win-x64
        path: ./TerminalAppRemover-win-x64.zip
        if-no-files-found: error

  release:
    # WinUI 3 unpackaged apps cannot ship as a single exe (XAML resources and
    # native DLLs must sit next to it) — the release is the ZIP only. The bare
    # exe that older releases attached did not run standalone.
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - name: Download Build Artifact
      uses: actions/download-artifact@v4
      with:
        name: TerminalAppRemover-win-x64

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          ./TerminalAppRemover-win-x64.zip
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
