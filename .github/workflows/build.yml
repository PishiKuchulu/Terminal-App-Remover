name: Build and Release

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

# Least privilege by default: builds and tests only READ the repo.
# Write access exists solely on the release job below.
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Run parser/matching unit tests
      shell: pwsh
      run: dotnet run --project tests/TerminalAppRemover.Tests -c Release

    - name: Verify release tag matches project version
      if: startsWith(github.ref, 'refs/tags/')
      shell: pwsh
      run: |
        [xml]$csproj = Get-Content src/TerminalAppRemover/TerminalAppRemover.csproj
        $version = $csproj.Project.PropertyGroup.Version | Select-Object -First 1
        $tag = "${{ github.ref_name }}".TrimStart('v')
        if ($version -ne $tag) {
          Write-Error "Tag v$tag does not match csproj <Version> $version. Bump the version or fix the tag."
          exit 1
        }
        Write-Host "Version check OK: $version"

    - name: Publish Self-Contained App (win-x64)
      shell: pwsh
      run: |
        dotnet publish src/TerminalAppRemover/TerminalAppRemover.csproj -c Release -r win-x64 --self-contained true -o ./publish/TerminalAppRemover-win-x64

    - name: Create ZIP Package
      shell: pwsh
      run: |
        Compress-Archive -Path ./publish/TerminalAppRemover-win-x64/* -DestinationPath ./TerminalAppRemover-win-x64.zip

    - name: Build single-file launcher (NativeAOT bootstrapper with embedded app ZIP)
      shell: pwsh
      run: |
        # WinUI 3 cannot be published as a true single file; the single-file
        # download is a small native bootstrapper carrying the app ZIP as an
        # embedded resource. It extracts to %LOCALAPPDATA%\TerminalAppRemover
        # on first run and launches the real app.
        $payload = (Resolve-Path ./TerminalAppRemover-win-x64.zip).Path
        dotnet publish bootstrapper/TerminalAppRemover.Bootstrapper.csproj -c Release -r win-x64 -p:PayloadZip="$payload" -o ./singlefile
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        Copy-Item ./singlefile/TerminalAppRemoverBootstrapper.exe ./TerminalAppRemover-SingleFile.exe
        $zipSize = (Get-Item ./TerminalAppRemover-win-x64.zip).Length
        $exeSize = (Get-Item ./TerminalAppRemover-SingleFile.exe).Length
        Write-Host "ZIP: $zipSize bytes; SingleFile: $exeSize bytes"
        if ($exeSize -le $zipSize) { Write-Error "Single-file exe should be larger than the ZIP (embedded payload)."; exit 1 }

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TerminalAppRemover-win-x64
        path: |
          ./TerminalAppRemover-win-x64.zip
          ./TerminalAppRemover-SingleFile.exe
        if-no-files-found: error

  release:
    # Two assets: the self-contained folder as a ZIP, and the single-file
    # launcher (NativeAOT bootstrapper with the app ZIP embedded). A bare
    # WinUI exe on its own — what older releases attached — cannot run,
    # because its XAML resources and native DLLs must sit next to it.
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - name: Download Build Artifact
      uses: actions/download-artifact@v4
      with:
        name: TerminalAppRemover-win-x64

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          ./TerminalAppRemover-win-x64.zip
          ./TerminalAppRemover-SingleFile.exe
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
